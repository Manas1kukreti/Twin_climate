[project]
name = "climatetwin"
version = "0.1.0"
description = "A lightweight AI-driven local climate digital twin inspired by Aurora and CREDIT"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

# Dependency bounds rationale (Phase 0, Python 3.14.5 venv):
#   - pandas >=3.0 requires numpy >=2.0; torch 2.13 and sklearn 1.9
#     both support numpy 2.x.  `pip check` confirms zero conflicts.
#   - Upper bounds are kept to next major version for stability.
dependencies = [
    "torch>=2.2.0,<3.0",
    "numpy>=2.0.0,<3.0",
    "pandas>=2.1.0,<4.0",
    "xarray>=2024.1.0",
    "scikit-learn>=1.4.0,<2.0",
    "joblib>=1.3.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "matplotlib>=3.8.0,<4.0",
    "plotly>=5.18.0,<6.0",
    "streamlit>=1.30.0,<2.0",
]

[project.optional-dependencies]
era5 = ["cdsapi>=0.7.0", "netcdf4>=1.6.0"]
dev = [
    "pytest>=8.0.0,<10.0",
    "ruff>=0.4.0,<1.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long — handled by formatter where practical
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --basetemp=.pytest_tmp"
tmp_path_retention_policy = "none"
